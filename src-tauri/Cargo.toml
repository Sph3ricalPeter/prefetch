[package]
name = "prefetch"
version = "0.24.1"
description = "A desktop git client"
authors = ["Sph3ricalPeter <sph3ricalpeter@gmail.com>"]
license = "MIT"
edition = "2021"

[lib]
name = "prefetch_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-fs = { version = "2.5.0", features = ["watch"] }
tauri-plugin-os = "2.3.2"
git2 = "0.20"
tokio = { version = "1.52.1", features = ["sync", "rt", "net", "io-util", "time", "macros"] }
notify = "8"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
urlencoding = "2"
open = "5"
dunce = "1"
base64 = "0.22"
tracing = { version = "0.1", features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt", "ansi"] }
tracing-chrome = "0.7"
chrono = { version = "0.4.44", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.dev]
# Keep the debug build cache from ballooning — target/ once hit 131 GB.
#   debug = "line-tables-only": keeps panic/backtrace file:line, drops bulky
#     per-variable symbols → .lib/.rlib artifacts ~3-4x smaller.
#   incremental = false: skips the per-edit cache that grew to 86 GB under a
#     continuous `tauri dev` edit-reload loop. Rebuilds are slower; that's fine
#     for unattended AI edits. See CLAUDE.md "Build & Disk Hygiene".
debug = "line-tables-only"
incremental = false
